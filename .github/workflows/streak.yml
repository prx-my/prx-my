name: Streak

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/scripts/update-streak.mjs"
      - ".github/workflows/streak.yml"

permissions:
  contents: write

concurrency:
  group: streak
  cancel-in-progress: true

jobs:
  streak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Regenerate streak.svg
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          GH_USER: prx-my
        run: node .github/scripts/update-streak.mjs

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add streak.svg
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: update streak.svg [skip ci]"
          git push
