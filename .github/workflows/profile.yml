name: Profile

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "scripts/console/**"
      - ".github/workflows/profile.yml"

permissions:
  contents: write

concurrency:
  group: profile
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install renderer
        run: pip install -r scripts/console/requirements.txt

      - name: Fetch live data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/console/fetch.py

      - name: Render console slices
        run: python scripts/console/render.py

      - name: Write README
        run: python scripts/console/readme.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets scripts/console/data
          if git diff --staged --quiet; then
            echo "Profile already up to date."
            exit 0
          fi
          git commit -m "chore: refresh profile console [skip ci]"
          git push
