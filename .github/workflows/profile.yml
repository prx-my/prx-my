name: Profile

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "scripts/generate-profile.mjs"
      - ".github/workflows/profile.yml"

permissions:
  contents: write

concurrency:
  group: profile
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Render profile assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: prx-my
        run: node scripts/generate-profile.mjs

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          if git diff --staged --quiet; then
            echo "Profile assets already up to date."
            exit 0
          fi
          git commit -m "chore: refresh profile artwork [skip ci]"
          git push
