<svg xmlns="http://www.w3.org/2000/svg" width="440" height="40" viewBox="0 0 440 40" role="img" aria-labelledby="t d">
<title id="t">All Sugar Labs merged PRs</title>
<desc id="d">All merged pull requests in Sugar Labs</desc>
<style>
@font-face{font-family:'JBM';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'JBM';font-weight:700;src:url(data:font/woff2;base64,) format('woff2')}
text{font-family:'JBM',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:15px}
.dim{fill:#57606a}.cy{fill:#0969da}.fg{fill:#24292f}.gr{fill:#1a7f37}.wh{fill:#0d1117}
@keyframes fadein{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.ln{animation:fadein .35s ease-out both}
.cursor{animation:blink 1.05s step-end infinite}
.dot{animation:pulse 2s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#0969da" stroke-opacity=".06"/></pattern>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
<filter id="g" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="4"/></filter>
</defs>
<path d="M424 -40V80" fill="none" stroke="#0969da" stroke-width="3" opacity=".55" />
<rect x="0" y="0" width="424" height="40" fill="#f6f8fa"/>
<rect x="0" y="0" width="424" height="40" fill="url(#grid)"/>
<g class="ln" style="animation-delay:.7s">
<text x="52" y="26" style="font-size:13px"><tspan class="gr">&gt;&gt;</tspan><tspan fill="#1a7f37"> all Sugar Labs merged</tspan></text>
<path d="M404 26l8-8M406 18h6v6" fill="none" stroke="#1a7f37" stroke-width="1.5"/>
</g>
<path d="M424 0V40" fill="none" stroke="#0969da" stroke-width="1.2"/>
</svg>
