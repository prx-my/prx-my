<svg xmlns="http://www.w3.org/2000/svg" width="494" height="212" viewBox="0 0 494 212" role="img" aria-labelledby="title detail">
  <title id="title">JanSamadhan</title>
  <desc id="detail">Civic reporting for Delhi. Uses PostGIS to detect duplicate reports and PostgreSQL to escalate overdue complaints. Watch demo.</desc>
  <style>
    @media not all {
      .activity { animation: activity-blip 1.3s ease-in-out -0.54s infinite; }
      .heartbeat { animation: heartbeat 5.4s ease-in-out -1.36s infinite; }
      .packet { animation: packet-travel 12s linear var(--delay) infinite; }
      .port-glow { animation: port-arrival 12s ease-out var(--delay) infinite; }
    }
    @keyframes activity-blip { 0%, 21%, 100% { opacity: .42; } 7% { opacity: 1; } }
    @keyframes heartbeat { 0%, 100% { opacity: .38; } 45% { opacity: .9; } }
    @keyframes packet-travel {
      0% { opacity: 0; stroke-dashoffset: 14; }
      .3% { opacity: 1; }
      7% { opacity: 1; stroke-dashoffset: -102; }
      7.3%, 100% { opacity: 0; stroke-dashoffset: -102; }
    }
    @keyframes port-arrival {
      0%, 5%, 100% { opacity: 0; }
      1.2% { opacity: .88; }
    }
  </style>
